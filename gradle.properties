org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official

# AndroidX 를 쓴다고 명시해야 한다. 이 줄이 없으면 :app 이 컴파일 근처도 못 가고
# checkDebugAarMetadata 단계에서 멈춘다. (지원 라이브러리 시절의 기본값이 남아 있다.)
android.useAndroidX=true
# 각 모듈의 R 클래스에 자기 리소스만 담는다. 빌드가 빨라지고, 다른 모듈 리소스를
# 실수로 참조하는 일이 컴파일에서 걸린다.
android.nonTransitiveRClass=true
