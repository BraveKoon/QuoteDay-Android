name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 이 워크플로가 하는 일은 하나다 — **안드로이드 컴파일러 노릇**.
# 개발 컨테이너에는 Android SDK 가 없어서 `:app` 을 그곳에서 빌드할 수 없다.
# `:core` 는 어디서나 빌드되므로 그쪽 테스트가 먼저, 빠르게 돈다.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: :core 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트
        run: |
          set -o pipefail
          ./gradlew :core:test --console=plain 2>&1 | tee build.log

      - name: 테스트 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

      # 요약은 잡의 **맨 마지막**에 둔다. Gradle 의 실패 출력은 수천 줄로 끝나는
      # 일이 많아서, 요약이 중간에 있으면 로그 끝을 봐도 보이지 않는다.
      - name: 실패한 곳만 추리기
        if: failure()
        run: |
          echo '=== 컴파일 오류 ==='
          grep -E "^e: |error:" build.log | head -40 || echo '(없음)'
          echo '=== Gradle 이 말한 것 ==='
          # 의존성 나열(:app:debugRuntimeClasspath -> ...)은 수백 줄씩 나오면서
          # 정작 원인은 그 위에 한두 줄로 적혀 있다. 나열을 걷어 내고 앞부분만 본다.
          grep -v 'RuntimeClasspath ->' build.log \
            | grep -v 'CompileClasspath ->' \
            | sed -n '/\* What went wrong:/,/^\* Try:/p' \
            | head -30

  app:
    name: :app 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # packages 를 비워 둔다. 기본값에는 폐기된 'tools' 패키지가 들어 있어
      # sdkmanager 가 "Failed to find package 'tools'" 로 죽는다. 러너 이미지에
      # 이미 SDK 가 있으므로 이 액션은 ANDROID_HOME 을 잡아 주기만 하면 된다.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: 디버그 APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --console=plain 2>&1 | tee build.log

      - name: 린트
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --console=plain 2>&1 | tee -a build.log

      # 릴리스 빌드는 R8 이 코드를 줄이고 이름을 바꾼다. 디버그에서는 멀쩡하던
      # 직렬화가 여기서 깨지는 일이 흔해서, 서명 없이라도 여기서 한 번 짓는다.
      - name: 릴리스 빌드 (서명 없음)
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --console=plain 2>&1 | tee -a build.log

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: quoteday-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: 린트 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports

      # 요약은 잡의 **맨 마지막**에 둔다. Gradle 의 실패 출력은 수천 줄로 끝나는
      # 일이 많아서, 요약이 중간에 있으면 로그 끝을 봐도 보이지 않는다.
      - name: 실패한 곳만 추리기
        if: failure()
        run: |
          echo '=== 컴파일 오류 ==='
          grep -E "^e: |error:" build.log | head -40 || echo '(없음)'
          echo '=== Gradle 이 말한 것 ==='
          # 의존성 나열(:app:debugRuntimeClasspath -> ...)은 수백 줄씩 나오면서
          # 정작 원인은 그 위에 한두 줄로 적혀 있다. 나열을 걷어 내고 앞부분만 본다.
          grep -v 'RuntimeClasspath ->' build.log \
            | grep -v 'CompileClasspath ->' \
            | sed -n '/\* What went wrong:/,/^\* Try:/p' \
            | head -30
